    /* ===== Pantalla de login: "Lámpara de Escritorio" interactiva (recoloreada a Light Cyan Technology) ===== */
    .lamp-bg-on {
      background:
        radial-gradient(ellipse 480px 620px at 50% 0%, rgba(0,220,235,0.20), transparent 70%),
        #062D43;
    }
    .lamp-dust-particle {
      position: absolute;
      top: 8%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(139,234,242,0.9);
      box-shadow: 0 0 4px 1px rgba(0,220,235,0.6);
      opacity: 0;
      animation-name: lamp-dust-fall;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes lamp-dust-fall {
      0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
      10%  { opacity: 0.9; }
      50%  { transform: translate(14px, 160px) scale(1); opacity: 0.6; }
      90%  { opacity: 0; }
      100% { transform: translate(-10px, 260px) scale(0.5); opacity: 0; }
    }

    // =========================================================================
    // SEGURIDAD DE CONTRASEÑAS (hash SHA-256 con sal por usuario)
    // =========================================================================
    // Formato guardado en Firestore: "salHex:hashHex" (nunca texto plano).
    // Nota honesta: al no haber un servidor propio (sitio estático + Firestore
    // directo desde el navegador), esto protege muy bien contra una fuga de la
    // base de datos o del código fuente, pero no es 100% equivalente a un
    // backend de autenticación real (Firebase Authentication + reglas por
    // usuario). Es la mejora práctica más fuerte posible sin cambiar cómo
    // entran hoy los usuarios.
    const generarSal = () => {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const hashConSal = async (texto, sal) => {
      const datos = new TextEncoder().encode(`${sal}:${texto}`);
      const buffer = await crypto.subtle.digest('SHA-256', datos);
      return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const generarPasswordHasheada = async (passwordPlano) => {
      const sal = generarSal();
      const hash = await hashConSal(passwordPlano, sal);
      return `${sal}:${hash}`;
    };

    const esFormatoHash = (valor) => typeof valor === 'string' && /^[0-9a-f]{32}:[0-9a-f]{64}$/.test(valor);

    // Convierte "DD/MM/AAAA HH:mm:ss" a Date, usado por los reportes/estadísticas.
    const parsearFechaHoraCompleta = (texto) => {
      if (!texto) return null;
      const [fecha, hora] = texto.split(' ');
      if (!fecha) return null;
      const [d, m, a] = fecha.split('/').map(Number);
      if (!d || !m || !a) return null;
      let hh = 0, mm = 0, ss = 0;
      if (hora) {
        const partes = hora.split(':').map(Number);
        hh = partes[0] || 0; mm = partes[1] || 0; ss = partes[2] || 0;
      }
      return new Date(a, m - 1, d, hh, mm, ss);
    };

    // formato antiguo (texto plano) para no romper el acceso de cuentas que
    // aún no se han logueado desde esta actualización; ese caso se migra
    // automáticamente a hash en el primer login exitoso (ver handleLogin).
    const verificarPassword = async (passwordIngresada, valorGuardado) => {
      if (!valorGuardado) return false;
      if (esFormatoHash(valorGuardado)) {
        const [sal, hash] = valorGuardado.split(':');
        const hashCalculado = await hashConSal(passwordIngresada, sal);
        return hashCalculado === hash;
      }
      return valorGuardado === passwordIngresada;
    };

      const totalPaginas = Math.max(1, Math.ceil(ordenesFiltradas.length / ITEMS_POR_PAGINA));
      const paginaSegura = Math.min(paginaActual, totalPaginas);
      const ordenesPaginadas = ordenesFiltradas.slice(
        (paginaSegura - 1) * ITEMS_POR_PAGINA,
        paginaSegura * ITEMS_POR_PAGINA
      );

      const limpiarFiltros = () => {
        setFiltroCodigoOit('');
        setFiltroEstado('TODOS');
        setFiltroCliente('');
        setFiltroTecnicoId('TODOS');
        setFiltroTipoTrabajo('TODOS');
        setFiltroFechaDesde('');
        setFiltroFechaHasta('');
        setPaginaActual(1);
      };

      // =========================================================================
      // "Estado de las OITs" y "Lista de OITs por Técnico" (Admin/Logística y Supervisor)
      // =========================================================================
      // Universo de OITs activas a mostrar en estas 2 secciones nuevas, según el rol:
      // Supervisor -> solo las de su Tipo de Trabajo. Admin/Logística -> todas.
      // Las CERRADO_CONCILIADO quedan fuera (se archivan en "🗂️ OITs Conciliadas", igual que siempre).
      const ordenesActivasRolActual = ordenes.filter(o => {
        if (o.estado === 'CERRADO_CONCILIADO') return false;
        if (!usuarioAutenticado) return false;
        if (usuarioAutenticado.rol === 'SUPERVISOR_SOLICITANTE') return o.tipoTrabajo === usuarioAutenticado.tipoTrabajo;
        return true; // ADMINISTRADOR / ADMIN_LOGISTICA ven todas
      });

      // "Estado de las OITs": mismos datos de siempre, ordenados de la más reciente a la más antigua.
      const ordenesEstadoOrdenadas = [...ordenesActivasRolActual].sort((a, b) => {
        const fa = parsearFechaHoraCompleta(a.fechaSolicitud);
        const fb = parsearFechaHoraCompleta(b.fechaSolicitud);
        return (fb ? fb.getTime() : 0) - (fa ? fa.getTime() : 0);
      });

      // Tarjetas de "Área" del Supervisor: a quién le corresponde actuar ahora.
      // ADMIN LOGÍSTICA: la solicitud está esperando que Logística la despache o la concilie.
      // TÉCNICO EJECUTANTE: ya fue despachada y el técnico la tiene en campo.
      const ordenesAreaAdminLogistica = ordenesActivasRolActual.filter(o =>
        o.estado === 'SOLICITADO' || o.estado === 'PENDIENTE' || o.estado === 'TRABAJO_FINALIZADO'
      );
      const ordenesAreaTecnico = ordenesActivasRolActual.filter(o => o.estado === 'DESPACHADO');

      // "Lista de OITs por Técnico": agrupa las OITs activas por técnico asignado.
      const listaOitsPorTecnico = (() => {
        const grupos = {};
        ordenesActivasRolActual.forEach(o => {
          const key = o.tecnicoId || 'SIN_ASIGNAR';
          if (!grupos[key]) {
            grupos[key] = { tecnicoId: o.tecnicoId || null, tecnicoNombre: o.tecnicoNombre || 'Sin técnico asignado', ordenes: [] };
          }
          grupos[key].ordenes.push(o);
        });
        return Object.values(grupos).sort((a, b) => b.ordenes.length - a.ordenes.length);
      })();

      // --- SINCRONIZACIÓN EN TIEMPO REAL CON FIRESTORE ---
      // Ojo: esta suscripción arranca SOLO después de iniciar sesión
      // (usuarioAutenticado truthy). Antes del login, la app ya no descarga
      // el padrón completo de usuarios (con sus contraseñas hasheadas) al
      // navegador; la validación de credenciales se hace con una consulta
      // puntual en handleLogin. Al cerrar sesión, la suscripción se cancela.
      useEffect(() => {
        if (!firebaseHabilitado || !db || !usuarioAutenticado) return;

        const unsubUsuarios = db.collection('usuarios').onSnapshot((snap) => {
          if (snap.empty) {
            USUARIOS_INICIALES.forEach(u => {
              db.collection('usuarios').doc(u.id).set(u);
            });
          } else {
            const listU = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setUsuarios(listU);
            localStorage.setItem('FELOSOTEC_USUARIOS_AUTH_V3', JSON.stringify(listU));
          }
        }, (err) => console.error("Error usuarios Firestore:", err));

        // Ojo: a diferencia de 'usuarios', aquí NO se vuelve a sembrar
        // ORDENES_INICIALES si la colección llega vacía. Una bandeja de
        // órdenes vacía es un estado normal (ej. limpiaste datos de prueba),
        // no un problema que haya que "reparar" solo. Antes, este auto-relleno
        // hacía que una OIT eliminada (cuando era la última que quedaba)
        // reapareciera sola al recargar la página.
        const unsubOrdenes = db.collection('ordenes_oit').onSnapshot((snap) => {
          const listO = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setOrdenes(listO);
          localStorage.setItem('FELOSOTEC_ORDENES_AUTH_V3', JSON.stringify(listO));
        }, (err) => console.error("Error órdenes Firestore:", err));

        return () => {
          unsubUsuarios();
          unsubOrdenes();
        };
      }, [usuarioAutenticado]);

      // --- SINCRONIZACIÓN DEL CATÁLOGO (MATERIALES / HERRAMIENTAS / EQUIPOS) ---
      // Un catálogo compartido en Firestore, visible y editable por cualquier rol una vez
      // que inició sesión (igual que usuarios/órdenes). Se ordena en el cliente por
      // descripción para el autocompletado.
      useEffect(() => {
        if (!firebaseHabilitado || !db || !usuarioAutenticado) return;

        const ordenarPorDescripcion = (lista) => [...lista].sort((a, b) => (a.descripcion || '').localeCompare(b.descripcion || ''));

        const unsubCatMateriales = db.collection('catalogo_materiales').onSnapshot((snap) => {
          setCatalogoMateriales(ordenarPorDescripcion(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        }, (err) => console.error("Error catálogo de materiales Firestore:", err));

        const unsubCatHerramientas = db.collection('catalogo_herramientas').onSnapshot((snap) => {
          setCatalogoHerramientas(ordenarPorDescripcion(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        }, (err) => console.error("Error catálogo de herramientas Firestore:", err));

        const unsubCatEquipos = db.collection('catalogo_equipos').onSnapshot((snap) => {
          setCatalogoEquipos(ordenarPorDescripcion(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        }, (err) => console.error("Error catálogo de equipos Firestore:", err));

        return () => {
          unsubCatMateriales();
          unsubCatHerramientas();
          unsubCatEquipos();
        };
      }, [usuarioAutenticado]);

      // --- SINCRONIZACIÓN DE PLANTILLAS DE SOLICITUD (SOLO SUPERVISOR) ---
      // Cada Supervisor ve y administra únicamente sus propias plantillas
      // (filtradas por supervisorId), no las de otros supervisores.
      useEffect(() => {
        if (!firebaseHabilitado || !db || !usuarioAutenticado || usuarioAutenticado.rol !== 'SUPERVISOR_SOLICITANTE') {
          setPlantillasSolicitud([]);
          return;
        }
        const unsubPlantillas = db.collection('plantillas_solicitudes')
          .where('supervisorId', '==', usuarioAutenticado.id)
          .onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
            setPlantillasSolicitud(lista);
          }, (err) => console.error("Error plantillas de solicitud Firestore:", err));

        return () => unsubPlantillas();
      }, [usuarioAutenticado]);

      useEffect(() => {
        if (usuarioAutenticado) {
          localStorage.setItem('FELOSOTEC_AUTH_SESSION_V3', JSON.stringify(usuarioAutenticado));
        } else {
          localStorage.removeItem('FELOSOTEC_AUTH_SESSION_V3');
        }
      }, [usuarioAutenticado]);

      // --- CIERRE DE SESIÓN AUTOMÁTICO POR INACTIVIDAD (30 minutos) ---
      useEffect(() => {
        if (!usuarioAutenticado) return;
        const LIMITE_INACTIVIDAD_MS = 30 * 60 * 1000;
        let temporizador = setTimeout(() => {
          setUsuarioAutenticado(null);
          alert('Sesión cerrada automáticamente por inactividad (30 min). Vuelva a iniciar sesión.');
        }, LIMITE_INACTIVIDAD_MS);

        const reiniciarTemporizador = () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            setUsuarioAutenticado(null);
            alert('Sesión cerrada automáticamente por inactividad (30 min). Vuelva a iniciar sesión.');
          }, LIMITE_INACTIVIDAD_MS);
        };

        const eventos = ['mousedown', 'keydown', 'touchstart', 'scroll'];
        eventos.forEach(ev => window.addEventListener(ev, reiniciarTemporizador));

        return () => {
          clearTimeout(temporizador);
          eventos.forEach(ev => window.removeEventListener(ev, reiniciarTemporizador));
        };
      }, [usuarioAutenticado]);

      useEffect(() => {
        if (tecnicos.length > 0 && !tecnicoAsignadoId) {
          setTecnicoAsignadoId(tecnicos[0].id);
        }
      }, [tecnicos]);

      // mensajeWhatsApp: texto alterno (más corto, sin materiales) solo para el botón de WhatsApp;
      // si no se indica, el botón usa el mismo texto del correo (mensaje).
      // whatsappDestinoCelular: fuerza el celular destino del botón de WhatsApp (en vez de
      // deducirlo del correo "para"), útil cuando el destinatario del WhatsApp es distinto
      // al destinatario principal del correo (ej. técnico asignado, o conciliador elegido).
      const dispararNotificacionCorreo = ({ remitente, para, cc, asunto, mensaje, mensajeWhatsApp, whatsappDestinoCelular }) => {
        setNotificacionEmailSimulada({ remitente, para, cc, asunto, mensaje, mensajeWhatsApp, whatsappDestinoCelular, timestamp: formatearFechaHora() });
      };

      // --- LOGIN (ACEPTA TANTO USERNAME COMO EMAIL) ---
      const [validandoLogin, setValidandoLogin] = useState(false);

      // Busca al usuario con una consulta puntual a Firestore (por username o
      // por email) en vez de descargar toda la colección antes de loguearse.
      const buscarUsuarioPorCredencial = async (entrada) => {
        if (firebaseHabilitado && db) {
          let snap = await db.collection('usuarios').where('username', '==', entrada).limit(1).get();
          if (snap.empty) {
            snap = await db.collection('usuarios').where('email', '==', entrada).limit(1).get();
          }
          if (!snap.empty) {
            const doc = snap.docs[0];
            return { id: doc.id, ...doc.data() };
          }
          // No hubo coincidencia en Firestore: permitir, como último recurso,
          // la cuenta de arranque de emergencia (USUARIOS_INICIALES). Antes
          // esta cuenta solo se creaba en Firestore si la colección 'usuarios'
          // llegaba vacía (lo cual nunca pasa en un sistema ya en uso), así
          // que en la práctica nunca quedaba disponible. Ahora, si coincide,
          // se crea recién en este momento para que funcione de inmediato y
          // quede disponible como una cuenta normal desde el próximo login.
          const bootstrap = USUARIOS_INICIALES.find(u => u.username.toLowerCase() === entrada || u.email.toLowerCase() === entrada);
          if (bootstrap) {
            try {
              await db.collection('usuarios').doc(bootstrap.id).set(bootstrap);
            } catch (err) {
              console.error('No se pudo crear la cuenta de arranque de emergencia en Firestore:', err);
            }
            return bootstrap;
          }
          return null;
        }
        // Fallback sin Firestore (modo local con USUARIOS_INICIALES/localStorage)
        return usuarios.find(u => u.username.toLowerCase() === entrada || u.email.toLowerCase() === entrada) || null;
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorLogin('');
        setValidandoLogin(true);
        try {
          const entrada = loginUser.trim().toLowerCase();
          const candidato = await buscarUsuarioPorCredencial(entrada);

          const passwordValida = candidato ? await verificarPassword(loginPass, candidato.password) : false;

          if (!candidato || !passwordValida) {
            setErrorLogin('Usuario o contraseña incorrectos. Verifique sus credenciales.');
            return;
          }

          let usuarioFinal = candidato;

          // Migración perezosa: si la contraseña todavía está en texto plano
          // (cuenta que no se ha logueado desde esta actualización), se
          // convierte a hash ahora mismo, de forma transparente para el usuario.
          if (firebaseHabilitado && db && !esFormatoHash(candidato.password)) {
            try {
              const nuevoValor = await generarPasswordHasheada(loginPass);
              await db.collection('usuarios').doc(candidato.id).update({ password: nuevoValor });
              usuarioFinal = { ...candidato, password: nuevoValor };
            } catch (err) {
              console.error('No se pudo migrar la contraseña a formato seguro:', err);
            }
          }

          setUsuarioAutenticado(usuarioFinal);
          setLoginUser('');
          setLoginPass('');
        } catch (err) {
          console.error('Error al iniciar sesión:', err);
          setErrorLogin('No se pudo validar el acceso. Intente nuevamente.');
        } finally {
          setValidandoLogin(false);
        }
      };

      const handleLogout = () => {
        setUsuarioAutenticado(null);
      };

      // --- CAMBIAR MI PROPIA CONTRASEÑA ---
      const guardarMiNuevaPassword = async (e) => {
        e.preventDefault();
        const actualValida = await verificarPassword(miPassActual, usuarioAutenticado.password);
        if (!actualValida) {
          return alert('La contraseña actual ingresada es incorrecta.');
        }
        if (miPassNueva.length < 4) {
          return alert('La nueva contraseña debe tener al menos 4 caracteres.');
        }
        if (miPassNueva !== miPassConfirmar) {
          return alert('La confirmación de la nueva contraseña no coincide.');
        }

        const nuevoValorPassword = firebaseHabilitado ? await generarPasswordHasheada(miPassNueva) : miPassNueva;

        const usuarioActualizado = {
          ...usuarioAutenticado,
          password: nuevoValorPassword
        };

        if (firebaseHabilitado && db) {
          await db.collection('usuarios').doc(usuarioActualizado.id).update({ password: nuevoValorPassword });
        }

        setUsuarioAutenticado(usuarioActualizado);
        setUsuarios(usuarios.map(u => u.id === usuarioActualizado.id ? usuarioActualizado : u));
        setMiPassActual('');
        setMiPassNueva('');
        setMiPassConfirmar('');
        setMostrarModalCambiarMiPassword(false);
        alert('✅ ¡Contraseña actualizada exitosamente en la nube!');
      };

      // --- PERSISTENCIA FIRESTORE ---
      const persistirUsuarioFirestore = async (uObj) => {
        if (firebaseHabilitado && db) {
          await db.collection('usuarios').doc(uObj.id).set(uObj);
        }
      };

      const eliminarUsuarioFirestore = async (id) => {
        if (firebaseHabilitado && db) {
          await db.collection('usuarios').doc(id).delete();
        }
      };

      const persistirOrdenFirestore = async (oObj) => {
        if (firebaseHabilitado && db) {
          await db.collection('ordenes_oit').doc(oObj.id).set(oObj);
        }
      };

      const eliminarOrdenFirestore = async (id) => {
        if (firebaseHabilitado && db) {
          await db.collection('ordenes_oit').doc(id).delete();
        }
      };

      // --- GESTIÓN USUARIOS ADMIN ---
      const abrirCreacionUsuarioAdmin = () => {
        setUsuarioEnEdicion(null);
        setUserUsername('');
        setUserPassword('');
        setUserNombre('');
        setUserEmail('');
        setUserCelular('');
        setUserRol('TECNICO_EJECUTANTE');
        setUserTipoTrabajo('Instalaciones');
      };

      const abrirEdicionUsuarioAdmin = (u) => {
        setUsuarioEnEdicion(u);
        setUserUsername(u.username);
        setUserPassword(''); // nunca se prellena: en blanco = no cambiar la contraseña
        setUserNombre(u.nombre);
        setUserEmail(u.email);
        setUserCelular(u.celular);
        setUserRol(u.rol);
        setUserTipoTrabajo(u.tipoTrabajo || 'Instalaciones');
      };

      // --- NOTIFICACIÓN DE BIENVENIDA CON DATOS DE ACCESO (WhatsApp Web + correo) ---
      // passwordPlano: solo se conoce justo al crear la cuenta (antes de guardarla con hash).
      // Si es null (por ejemplo, al reenviar la bienvenida de un usuario ya existente), el
      // mensaje avisa que la contraseña ya está protegida y hay que restablecerla si hace falta.
      const construirMensajeBienvenidaUsuario = (usuarioObj, passwordPlano) => {
        const lineaPassword = passwordPlano
          ? `Contraseña: ${passwordPlano}`
          : 'Contraseña: (ya protegida en el sistema. Si la olvidó, pida a un Administrador que se la restablezca desde "Gestión de Usuarios")';
        const lineaTipoTrabajo = usuarioObj.rol === 'SUPERVISOR_SOLICITANTE' ? `\nTipo de Trabajo: ${usuarioObj.tipoTrabajo}` : '';
        const enlacePlataforma = 'https://elvisarticipri-yarvis.github.io/logistica-felosotec/';
        return `¡Hola ${usuarioObj.nombre}! Te damos la bienvenida a FELOSOTEC E.I.R.L. 👋\n\nYa tienes acceso al Dashboard de Gestión Logística (LOG_RE_03).\n\n🔗 Enlace para ingresar a la plataforma:\n${enlacePlataforma}\n\nTus datos de acceso son:\n\nUsuario: ${usuarioObj.username}\n${lineaPassword}\nNombre: ${usuarioObj.nombre}\nCorreo: ${usuarioObj.email}\nCelular: ${usuarioObj.celular}\nRol: ${usuarioObj.rol}${lineaTipoTrabajo}\n\nPor seguridad, te recomendamos cambiar tu contraseña apenas ingreses (botón "🔑 Clave" arriba a la derecha).\n\n¡Éxitos en tu trabajo!`;
      };

      const notificarBienvenidaUsuario = (usuarioObj, passwordPlano) => {
        dispararNotificacionCorreo({
          remitente: usuarioAutenticado.email,
          para: usuarioObj.email,
          cc: '',
          asunto: `Bienvenida y Accesos - FELOSOTEC E.I.R.L. (${usuarioObj.nombre})`,
          mensaje: construirMensajeBienvenidaUsuario(usuarioObj, passwordPlano),
          whatsappDestinoCelular: usuarioObj.celular
        });
      };

      const guardarUsuarioAdmin = async (e) => {
        e.preventDefault();
        const esEdicion = !!usuarioEnEdicion;
        // Al editar, la contraseña es opcional (en blanco = no se cambia).
        // Al crear una cuenta nueva, sí es obligatoria.
        if (!userUsername.trim() || !userNombre.trim() || (!esEdicion && !userPassword.trim())) {
          return alert('Complete todos los campos obligatorios.');
        }

        const ahora = formatearFechaHora();
        const tipoFinal = userRol === 'SUPERVISOR_SOLICITANTE' ? userTipoTrabajo : 'N/A';

        if (esEdicion) {
          const valorPassword = userPassword.trim()
            ? (firebaseHabilitado ? await generarPasswordHasheada(userPassword) : userPassword)
            : usuarioEnEdicion.password; // sin cambios

          const uActualizado = {
            ...usuarioEnEdicion,
            username: userUsername.trim().toLowerCase(),
            password: valorPassword,
            nombre: userNombre.toUpperCase().trim(),
            email: userEmail.toLowerCase().trim(),
            celular: userCelular.trim(),
            rol: userRol,
            tipoTrabajo: tipoFinal
          };
          await persistirUsuarioFirestore(uActualizado);
          setUsuarios(usuarios.map(u => u.id === usuarioEnEdicion.id ? uActualizado : u));
          alert(`[${ahora}] Usuario ${userUsername} actualizado.`);
        } else {
          if (usuarios.some(u => u.username.toLowerCase() === userUsername.trim().toLowerCase())) {
            return alert('El nombre de usuario ya existe.');
          }

          const valorPassword = firebaseHabilitado ? await generarPasswordHasheada(userPassword) : userPassword;

          const nuevo = {
            id: Date.now().toString(),
            username: userUsername.trim().toLowerCase(),
            password: valorPassword,
            nombre: userNombre.toUpperCase().trim(),
            email: userEmail.toLowerCase().trim(),
            celular: userCelular.trim(),
            rol: userRol,
            tipoTrabajo: tipoFinal
          };
          await persistirUsuarioFirestore(nuevo);
          setUsuarios([...usuarios, nuevo]);
          alert(`[${ahora}] Cuenta ${nuevo.nombre} creada.`);
          // Notificación automática de bienvenida con los datos de acceso (WhatsApp Web + correo).
          notificarBienvenidaUsuario(nuevo, userPassword);
        }

        abrirCreacionUsuarioAdmin();
      };

      const eliminarUsuarioAdmin = async (id, nombre) => {
        if (id === usuarioAutenticado.id) return alert('No puede eliminar su propia cuenta activa.');
        if (confirm(`¿Eliminar al colaborador ${nombre}?`)) {
          await eliminarUsuarioFirestore(id);
          setUsuarios(usuarios.filter(u => u.id !== id));
        }
      };

      // --- CARGA MASIVA DE USUARIOS (EXCEL) ---
      const ROLES_VALIDOS_CARGA_MASIVA = ['TECNICO_EJECUTANTE', 'SUPERVISOR_SOLICITANTE', 'ADMIN_LOGISTICA', 'ADMINISTRADOR'];

      const descargarPlantillaUsuarios = () => {
        const filaEjemplo1 = {
          "USUARIO": "jperez",
          "CONTRASEÑA": "clave1234",
          "NOMBRE COMPLETO": "PEREZ GOMEZ JUAN CARLOS",
          "CORREO": "jperez@felosotec.com",
          "CELULAR": "+51987654321",
          "ROL (TECNICO_EJECUTANTE / SUPERVISOR_SOLICITANTE / ADMIN_LOGISTICA / ADMINISTRADOR)": "TECNICO_EJECUTANTE",
          "TIPO DE TRABAJO (solo si el ROL es SUPERVISOR_SOLICITANTE)": ""
        };
        const filaEjemplo2 = {
          "USUARIO": "msupervisor",
          "CONTRASEÑA": "clave5678",
          "NOMBRE COMPLETO": "SOTO RAMOS MARIA ELENA",
          "CORREO": "msoto@felosotec.com",
          "CELULAR": "+51988112233",
          "ROL (TECNICO_EJECUTANTE / SUPERVISOR_SOLICITANTE / ADMIN_LOGISTICA / ADMINISTRADOR)": "SUPERVISOR_SOLICITANTE",
          "TIPO DE TRABAJO (solo si el ROL es SUPERVISOR_SOLICITANTE)": "Instalaciones"
        };

        const ws = XLSX.utils.json_to_sheet([filaEjemplo1, filaEjemplo2]);
        ws['!cols'] = [
          { wch: 14 }, { wch: 14 }, { wch: 32 }, { wch: 26 }, { wch: 16 }, { wch: 58 }, { wch: 42 }
        ];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Plantilla Usuarios");
        XLSX.writeFile(wb, "FELOSOTEC_Plantilla_Carga_Masiva_Usuarios.xlsx");
      };

      const dispararSelectorArchivoCargaMasiva = () => {
        if (cargaMasivaInputRef.current) cargaMasivaInputRef.current.click();
      };

      const manejarCargaMasivaUsuarios = async (e) => {
        const archivo = e.target.files && e.target.files[0];
        if (!archivo) return;
        setCargandoMasivoUsuarios(true);

        try {
          const arrayBuffer = await archivo.arrayBuffer();
          const wb = XLSX.read(arrayBuffer, { type: 'array' });
          const primeraHoja = wb.Sheets[wb.SheetNames[0]];
          const filas = XLSX.utils.sheet_to_json(primeraHoja, { defval: '' });

          if (filas.length === 0) {
            alert('El archivo no tiene filas de datos. Use la plantilla descargable como base.');
            return;
          }

          // Lee un campo buscando la columna por coincidencia flexible del encabezado
          // (para que funcione aunque el usuario simplifique o reordene los títulos de columna).
          const obtenerCampo = (fila, posiblesNombres) => {
            for (const clave of Object.keys(fila)) {
              const claveNormalizada = clave.trim().toUpperCase();
              if (posiblesNombres.some(n => claveNormalizada.startsWith(n))) {
                return String(fila[clave] ?? '').trim();
              }
            }
            return '';
          };

          const usernamesExistentes = new Set(usuarios.map(u => u.username.toLowerCase()));
          const nuevosUsuarios = [];
          const errores = [];

          for (let i = 0; i < filas.length; i++) {
            const fila = filas[i];
            const numFila = i + 2; // fila 1 = encabezado

            const username = obtenerCampo(fila, ['USUARIO']).toLowerCase();
            const password = obtenerCampo(fila, ['CONTRASEÑA', 'CONTRASENA', 'PASSWORD', 'CLAVE']);
            const nombre = obtenerCampo(fila, ['NOMBRE']);
            const email = obtenerCampo(fila, ['CORREO', 'EMAIL']).toLowerCase();
            const celular = obtenerCampo(fila, ['CELULAR', 'WHATSAPP', 'TELEFONO', 'TELÉFONO']);
            const rol = obtenerCampo(fila, ['ROL']).toUpperCase();
            const tipoTrabajo = obtenerCampo(fila, ['TIPO DE TRABAJO', 'TIPOTRABAJO']);

            // Fila totalmente vacía: se ignora en silencio (no cuenta como error)
            if (!username && !nombre && !email && !celular && !rol) continue;

            if (!username || !password || !nombre || !email || !celular || !rol) {
              errores.push(`Fila ${numFila}: faltan datos obligatorios (usuario, contraseña, nombre, correo, celular o rol).`);
              continue;
            }
            if (!ROLES_VALIDOS_CARGA_MASIVA.includes(rol)) {
              errores.push(`Fila ${numFila}: rol "${rol}" no es válido. Use uno de: ${ROLES_VALIDOS_CARGA_MASIVA.join(', ')}.`);
              continue;
            }
            if (usernamesExistentes.has(username)) {
              errores.push(`Fila ${numFila}: el usuario "${username}" ya existe y se omitió.`);
              continue;
            }

            const passwordHasheada = firebaseHabilitado ? await generarPasswordHasheada(password) : password;

            const nuevo = {
              id: (Date.now() + i).toString(),
              username,
              password: passwordHasheada,
              nombre: nombre.toUpperCase(),
              email,
              celular,
              rol,
              tipoTrabajo: rol === 'SUPERVISOR_SOLICITANTE' ? (tipoTrabajo || 'Instalaciones') : 'N/A'
            };

            usernamesExistentes.add(username);
            nuevosUsuarios.push(nuevo);
          }

          for (const u of nuevosUsuarios) {
            await persistirUsuarioFirestore(u);
          }
          if (nuevosUsuarios.length > 0) {
            setUsuarios([...usuarios, ...nuevosUsuarios]);
          }

          let resumen = `Carga masiva completada:\n✅ ${nuevosUsuarios.length} usuario(s) creado(s).`;
          if (errores.length > 0) {
            resumen += `\n\n⚠️ ${errores.length} fila(s) con problemas:\n${errores.slice(0, 15).join('\n')}`;
            if (errores.length > 15) resumen += `\n… y ${errores.length - 15} más.`;
          }
          alert(resumen);
        } catch (err) {
          console.error('Error en carga masiva de usuarios:', err);
          alert(describirErrorFirestore(err));
        } finally {
          setCargandoMasivoUsuarios(false);
          if (cargaMasivaInputRef.current) cargaMasivaInputRef.current.value = '';
        }
      };

      // --- CATÁLOGO DE MATERIALES / HERRAMIENTAS / EQUIPOS ---
      // Disponible para cualquier rol: sirve para autocompletar "Descripción del Ítem" al
      // crear/editar/despachar una OIT, y se mantiene con carga masiva (Excel) o altas
      // individuales, igual que el catálogo de usuarios.
      const obtenerCatalogoPorCategoria = (categoria) => {
        if (categoria === 'HERRAMIENTA') return catalogoHerramientas;
        if (categoria === 'EQUIPO') return catalogoEquipos;
        return catalogoMateriales;
      };

      const obtenerColeccionCatalogoPorCategoria = (categoria) => {
        if (categoria === 'HERRAMIENTA') return 'catalogo_herramientas';
        if (categoria === 'EQUIPO') return 'catalogo_equipos';
        return 'catalogo_materiales';
      };

      const actualizarEstadoCatalogoPorCategoria = (categoria, listaNueva) => {
        if (categoria === 'HERRAMIENTA') setCatalogoHerramientas(listaNueva);
        else if (categoria === 'EQUIPO') setCatalogoEquipos(listaNueva);
        else setCatalogoMateriales(listaNueva);
      };

      // Opciones de <datalist> para el autocompletado del campo "Descripción del Ítem"
      // (Nuevo Requerimiento del Supervisor, Añadir Ítem en Editar OIT, y Despacho).
      const opcionesCatalogo = (categoria) => obtenerCatalogoPorCategoria(categoria).map(p => (
        <option key={p.id} value={p.descripcion} />
      ));

      // Traduce un error de Firestore a un mensaje accionable. El caso más común al
      // recién agregar una colección nueva (como catalogo_materiales/herramientas/equipos)
      // es que falte pegar la regla de seguridad correspondiente en Firebase Console:
      // Firestore deniega por defecto ("permission-denied") lo que no tenga regla explícita.
      const describirErrorFirestore = (err, contexto) => {
        const codigo = err && err.code;
        const mensaje = String((err && err.message) || err || '');
        if (codigo === 'permission-denied' || /permission|insufficient permissions/i.test(mensaje)) {
          const detalle = contexto || 'el catálogo (colecciones catalogo_materiales, catalogo_herramientas, catalogo_equipos)';
          return `Firestore rechazó la operación por permisos (permission-denied). Es muy probable que falten las reglas de seguridad para ${detalle}. Revise las notas técnicas y vuelva a pegar/publicar las reglas en Firebase Console → Firestore Database → Reglas.`;
        }
        return `Ocurrió un error inesperado: ${mensaje || codigo || 'sin detalle'}`;
      };

      const agregarProductoCatalogo = async () => {
        const categoria = catalogoTabActiva;
        const descripcion = catalogoItemNuevo.trim();
        if (!descripcion) return alert('Escriba la descripción del producto.');

        const listaActual = obtenerCatalogoPorCategoria(categoria);
        if (listaActual.some(p => p.descripcion.toLowerCase() === descripcion.toLowerCase())) {
          alert('Ese producto ya está en el catálogo.');
          setCatalogoItemNuevo('');
          return;
        }

        const nuevo = { id: Date.now().toString(), descripcion, creadoPor: usuarioAutenticado.nombre, fechaHora: formatearFechaHora() };
        const coleccion = obtenerColeccionCatalogoPorCategoria(categoria);

        try {
          if (firebaseHabilitado && db) {
            await db.collection(coleccion).doc(nuevo.id).set(nuevo);
          }
          const listaNueva = [...listaActual, nuevo].sort((a, b) => a.descripcion.localeCompare(b.descripcion));
          actualizarEstadoCatalogoPorCategoria(categoria, listaNueva);
          setCatalogoItemNuevo('');
        } catch (err) {
          console.error('Error al agregar producto al catálogo:', err);
          alert(describirErrorFirestore(err));
        }
      };

      const eliminarProductoCatalogo = async (categoria, id, descripcion) => {
        if (!confirm(`¿Eliminar "${descripcion}" del catálogo?`)) return;
        const coleccion = obtenerColeccionCatalogoPorCategoria(categoria);
        try {
          if (firebaseHabilitado && db) {
            await db.collection(coleccion).doc(id).delete();
          }
          actualizarEstadoCatalogoPorCategoria(categoria, obtenerCatalogoPorCategoria(categoria).filter(p => p.id !== id));
        } catch (err) {
          console.error('Error al eliminar producto del catálogo:', err);
          alert(describirErrorFirestore(err));
        }
      };

      const descargarPlantillaCatalogo = (categoria) => {
        const etiqueta = categoria === 'MATERIAL' ? 'Materiales' : categoria === 'HERRAMIENTA' ? 'Herramientas' : 'Equipos';
        const ejemplos = categoria === 'EQUIPO'
          ? ['Router H3C MSR1008', 'Switch TP-Link 24 Puertos']
          : categoria === 'HERRAMIENTA'
          ? ['Ponchadora RJ45 AMP', 'Taladro Inalámbrico Bosch']
          : ['Cintillos Blancos 200mm', 'Cable UTP Cat6 (metro)'];

        const ws = XLSX.utils.json_to_sheet(ejemplos.map(d => ({ "DESCRIPCIÓN": d })));
        ws['!cols'] = [{ wch: 50 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `Catalogo ${etiqueta}`);
        XLSX.writeFile(wb, `FELOSOTEC_Plantilla_Catalogo_${etiqueta}.xlsx`);
      };

      const dispararSelectorArchivoCatalogo = () => {
        if (cargaCatalogoInputRef.current) cargaCatalogoInputRef.current.click();
      };

      const manejarCargaMasivaCatalogo = async (e) => {
        const archivo = e.target.files && e.target.files[0];
        if (!archivo) return;
        const categoria = catalogoTabActiva;
        setCargandoCatalogo(true);

        try {
          const arrayBuffer = await archivo.arrayBuffer();
          const wb = XLSX.read(arrayBuffer, { type: 'array' });
          const primeraHoja = wb.Sheets[wb.SheetNames[0]];
          const filas = XLSX.utils.sheet_to_json(primeraHoja, { defval: '' });

          if (filas.length === 0) {
            alert('El archivo no tiene filas de datos. Use la plantilla descargable como base.');
            return;
          }

          const obtenerCampo = (fila, posiblesNombres) => {
            for (const clave of Object.keys(fila)) {
              const claveNormalizada = clave.trim().toUpperCase();
              if (posiblesNombres.some(n => claveNormalizada.startsWith(n))) {
                return String(fila[clave] ?? '').trim();
              }
            }
            return '';
          };

          const listaActual = obtenerCatalogoPorCategoria(categoria);
          const descripcionesExistentes = new Set(listaActual.map(p => p.descripcion.toLowerCase()));
          const coleccion = obtenerColeccionCatalogoPorCategoria(categoria);
          const nuevosProductos = [];
          let omitidosVacioORepetido = 0;

          for (let i = 0; i < filas.length; i++) {
            const descripcion = obtenerCampo(filas[i], ['DESCRIPCIÓN', 'DESCRIPCION', 'PRODUCTO', 'ITEM', 'ÍTEM']);
            if (!descripcion) continue;
            if (descripcionesExistentes.has(descripcion.toLowerCase())) { omitidosVacioORepetido++; continue; }

            const nuevo = { id: (Date.now() + i).toString(), descripcion, creadoPor: usuarioAutenticado.nombre, fechaHora: formatearFechaHora() };
            descripcionesExistentes.add(descripcion.toLowerCase());
            nuevosProductos.push(nuevo);
          }

          for (const p of nuevosProductos) {
            if (firebaseHabilitado && db) await db.collection(coleccion).doc(p.id).set(p);
          }

          if (nuevosProductos.length > 0) {
            const listaNueva = [...listaActual, ...nuevosProductos].sort((a, b) => a.descripcion.localeCompare(b.descripcion));
            actualizarEstadoCatalogoPorCategoria(categoria, listaNueva);
          }

          let resumen = `Carga masiva completada:\n✅ ${nuevosProductos.length} producto(s) agregado(s).`;
          if (omitidosVacioORepetido > 0) resumen += `\n⚠️ ${omitidosVacioORepetido} fila(s) omitida(s) por estar repetidas o vacías.`;
          alert(resumen);
        } catch (err) {
          console.error('Error en carga masiva de catálogo:', err);
          alert(describirErrorFirestore(err));
        } finally {
          setCargandoCatalogo(false);
          if (cargaCatalogoInputRef.current) cargaCatalogoInputRef.current.value = '';
        }
      };

      const eliminarRequerimientoAdmin = async (id, codigoOit) => {
        if (confirm(`⚠️ ¿Desea eliminar definitivamente el requerimiento OIT/TK "${codigoOit}"?`)) {

          setOrdenes(ordenes.filter(ord => ord.id !== id));
          alert(`[${formatearFechaHora()}] Requerimiento ${codigoOit} eliminado.`);
        }
      };

      // --- ALTA TÉCNICO SUPERVISOR ---
      const registrarTecnicoPorSupervisor = async (e) => {
        e.preventDefault();
        if (!tecNombre.trim() || !tecEmail.trim() || !tecCelular.trim()) return alert('Complete los datos');
        const ahora = formatearFechaHora();
        const baseUsername = tecEmail.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
        const passwordProvisional = 'tecnico123'; // se comunica aparte al técnico; debe cambiarla en su primer ingreso
        const valorPasswordTecnico = firebaseHabilitado ? await generarPasswordHasheada(passwordProvisional) : passwordProvisional;

        const nuevoTecnico = {
          id: Date.now().toString(),
          username: baseUsername,

          celular: tecCelular.trim(),

        };

        await persistirUsuarioFirestore(nuevoTecnico);
        setUsuarios([...usuarios, nuevoTecnico]);
        setTecNombre('');
        setTecEmail('');
        setTecCelular('');
        setMostrarModalCrearTecnicoSupervisor(false);
        alert(`[${ahora}] Técnico ${nuevoTecnico.nombre} registrado.\n\nUsuario: ${nuevoTecnico.username}\nContraseña provisional: ${passwordProvisional}\n\nComuníquele esta contraseña por un canal seguro y pídale cambiarla apenas ingrese (botón 🔑 Clave).`);
        // Notificación automática de bienvenida con los datos de acceso (WhatsApp Web + correo).
        notificarBienvenidaUsuario(nuevoTecnico, passwordProvisional);
      };

      // --- OPERACIONES OIT ---
      const agregarItemBorrador = () => {
        if (!itemDesc.trim()) return alert('Ingrese la descripción');
        const nuevo = {
          id: Date.now().toString(),

          destino: itemDestino,

          cantidadDevuelta: 0,

        };

        setItemSerie('');

      // --- PLANTILLAS DE SOLICITUD (SUPERVISOR) ---

      // único de cada solicitud. El Cliente sí se puede guardar, pero es OPCIONAL:
      // solo tiene sentido si el supervisor repite siempre el mismo cliente final en
      // esa plantilla; si lo deja vacío, al usarla el campo Cliente Final no se toca.
      const guardarPlantillaActual = async () => {
        const nombre = nombrePlantillaNueva.trim();
        if (!nombre) return alert('Ingrese un nombre para la plantilla.');
        if (itemsBorrador.length === 0) return alert('Añada al menos un ítem antes de guardar la plantilla.');

        const nueva = {
          id: Date.now().toString(),
          supervisorId: usuarioAutenticado.id,
          supervisorNombre: usuarioAutenticado.nombre,
          nombre,
          cliente: clientePlantillaNueva.trim(), // opcional
          items: itemsBorrador,
          fechaCreacion: formatearFechaHora()
        };

        try {
          if (firebaseHabilitado && db) {
            await db.collection('plantillas_solicitudes').doc(nueva.id).set(nueva);
          } else {
            setPlantillasSolicitud([...plantillasSolicitud, nueva]);
          }
          setNombrePlantillaNueva('');
          setClientePlantillaNueva('');
          alert(`Plantilla "${nombre}" guardada.`);
        } catch (err) {
          console.error('Error al guardar plantilla de solicitud:', err);
          alert(describirErrorFirestore(err, 'las plantillas de solicitud (colección plantillas_solicitudes)'));
        }
      };

      // Carga la plantilla en el formulario actual (con ids nuevos, para no chocar
      // con los ítems ya presentes) y la deja lista para editar antes de enviar.
      // Si la plantilla tiene un Cliente guardado (opcional), se rellena también
      // el campo Cliente Final del formulario.
      const usarPlantilla = (plantilla) => {

        setItemsBorrador([...itemsBorrador, ...itemsClonados]);

        };

      const eliminarItemEnEdicionPlantilla = (id) => {

          ...plantillaEnEdicion,
          items: (plantillaEnEdicion.items || []).filter(i => i.id !== id)
        });

      const actualizarCampoItemEnEdicionPlantilla = (id, campo, valor) => {

        });

      const guardarEdicionPlantilla = async () => {

          } else {

      const crearSolicitudOit = async (e) => {

        const supervisorActual = usuarioAutenticado;
        const tecnicoObj = usuarios.find(u => u.id === tecnicoAsignadoId) || tecnicos[0];
        const logisticaObj = usuarios.find(u => u.rol === 'ADMIN_LOGISTICA') || { nombre: 'ARANA ALDAVE ALCIDES ALFREDO', email: 'aarana@felosotec.com' };

          historialMovimientos: [
            {

            }

        await persistirOrdenFirestore(nuevaOrden);
        setOrdenes([nuevaOrden, ...ordenes]);
        setItemsBorrador([]);
        setCodigoOit('');
        setCliente('');

        const asuntoCorreo = `Solicitud de Equipos y/o Materiales (${nuevaOrden.codigoOit} y ${nuevaOrden.cliente})`;
        const cuerpoCorreo = `Estimada Área de Logística,\n\nSe ha generado un nuevo requerimiento de despacho:\n- OIT / TK: ${nuevaOrden.codigoOit}\n- Cliente: ${nuevaOrden.cliente}\n- Tipo de Trabajo: ${nuevaOrden.tipoTrabajo}\n- Supervisor Solicitante: ${nuevaOrden.supervisorNombre} (${nuevaOrden.supervisorEmail})\n- Técnico Asignado: ${nuevaOrden.tecnicoNombre} (${nuevaOrden.tecnicoEmail})\n\nÍTEMS SOLICITADOS:\n${nuevaOrden.items.map(i => `• [${i.categoria}] ${i.descripcion} | Cant: ${i.cantidadSolicitada} ${i.unidad} | Destino: ${i.destino}`).join('\n')}\n\nFavor de proceder con la validación y despacho correspondiente.`;

        dispararNotificacionCorreo({

          cc: tecnicoObj.email,
          asunto: asuntoCorreo,

        });

        alert(`[${ahora}] Solicitud ${nuevaOrden.codigoOit} guardada y enviada.`);
      };

      const abrirModalEdicionOit = (ord) => {
        setOitEnEdicion(JSON.parse(JSON.stringify(ord)));

            {/* MODAL: EDITAR PLANTILLA DE SOLICITUD (SUPERVISOR) — sobre el modal de Plantillas */}
            {plantillaEnEdicion && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[55] flex items-center justify-center p-4" onClick={() => setPlantillaEnEdicion(null)}>
                <div className="bg-white border border-line-strong rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                  <div className="border-b border-line-soft pb-3 flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-bold text-ink-primary">✏️ Editar Plantilla</h3>
                      <p className="text-xs text-ink-support">Modifique el nombre, el cliente (opcional) y los ítems de esta plantilla</p>
                    </div>
                    <button onClick={() => setPlantillaEnEdicion(null)} className="text-ink-support hover:text-ink-primary text-lg">✕</button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="block text-ink-support mb-1 font-semibold">Nombre de la Plantilla *</label>
                      <input
                        type="text"
                        value={plantillaEnEdicion.nombre}
                        onChange={e => setPlantillaEnEdicion({ ...plantillaEnEdicion, nombre: e.target.value })}
                        className="w-full bg-white border border-line-strong rounded p-2 text-ink-primary"
                      />
                    </div>
                    <div>
                      <label className="block text-ink-support mb-1 font-semibold">Cliente (opcional)</label>
                      <input
                        type="text"
                        placeholder="Ej. SUPERMERCADOS PERUANOS S.P.S.A."
                        value={plantillaEnEdicion.cliente || ''}
                        onChange={e => setPlantillaEnEdicion({ ...plantillaEnEdicion, cliente: e.target.value })}
                        className="w-full bg-white border border-line-strong rounded p-2 text-ink-primary"
                      />
                    </div>
                  </div>

                  <div className="bg-surface-alt p-3.5 rounded-lg border border-line-soft space-y-2">
                    <p className="text-xs font-bold text-brand-petrol">+ Añadir Ítem a la Plantilla</p>
                    <div className="grid grid-cols-1 sm:grid-cols-6 gap-2 text-xs">
                      <div>
                        <label className="block text-ink-support mb-0.5">Categoría</label>
                        <select
                          value={plEditItemCat}
                          onChange={e => setPlEditItemCat(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        >
                          <option value="MATERIAL">Material</option>
                          <option value="HERRAMIENTA">Herramienta</option>
                          <option value="EQUIPO">Equipo</option>
                        </select>
                      </div>
                      <div className="sm:col-span-2">
                        <label className="block text-ink-support mb-0.5">Descripción</label>
                        <input
                          type="text"
                          list="datalist-catalogo-editplantilla"
                          placeholder="Descripción del ítem"
                          value={plEditItemDesc}
                          onChange={e => setPlEditItemDesc(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        />
                        <datalist id="datalist-catalogo-editplantilla">{opcionesCatalogo(plEditItemCat)}</datalist>
                      </div>
                      {plEditItemCat !== 'MATERIAL' && (
                        <div>
                          <label className="block text-ink-support mb-0.5">{etiquetaSerieCategoria(plEditItemCat)}</label>
                          <input
                            type="text"
                            placeholder="Ej. H3C-99281"
                            value={plEditItemSerie}
                            onChange={e => setPlEditItemSerie(e.target.value)}
                            className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                          />
                        </div>
                      )}
                      <div>
                        <label className="block text-ink-support mb-0.5">Cant.</label>
                        <input
                          type="number"
                          min="1"
                          value={plEditItemCant}
                          onChange={e => setPlEditItemCant(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        />
                      </div>
                      <div>
                        <label className="block text-ink-support mb-0.5">Destino</label>
                        <select
                          value={plEditItemDestino}
                          onChange={e => setPlEditItemDestino(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        >
                          <option value="CLIENTE">CLIENTE</option>
                          <option value="NODO">NODO</option>
                        </select>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={agregarItemEnEdicionPlantilla}
                      className="w-full bg-surface-alt hover:bg-surface-secondary text-brand-petrol py-1.5 rounded text-xs font-semibold"
                    >
                      Añadir Ítem
                    </button>
                  </div>

                  <div className="space-y-2">
                    <p className="text-xs font-bold text-ink-secondary">Ítems de esta Plantilla ({plantillaEnEdicion.items?.length || 0}):</p>
                    <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                      {plantillaEnEdicion.items?.map((it) => (
                        <div key={it.id} className="bg-white p-2.5 rounded border border-line-soft text-xs space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-mono text-brand-blue font-bold bg-white px-1.5 py-0.5 rounded">[{it.categoria}]</span>
                            <button
                              type="button"
                              onClick={() => eliminarItemEnEdicionPlantilla(it.id)}
                              className="text-rose-600 hover:text-rose-700 font-semibold"
                            >
                              ✕ Quitar
                            </button>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-5 gap-2">
                            <div className="sm:col-span-2">
                              <label className="text-[10px] text-ink-support block">Descripción</label>
                              <input
                                type="text"
                                value={it.descripcion}
                                onChange={e => actualizarCampoItemEnEdicionPlantilla(it.id, 'descripcion', e.target.value)}
                                className="w-full bg-white border border-line-strong rounded p-1 text-ink-primary"
                              />
                            </div>
                            {it.categoria !== 'MATERIAL' && (
                              <div>
                                <label className="text-[10px] text-ink-support block">{etiquetaSerieCategoria(it.categoria)}</label>
                                <input
                                  type="text"
                                  value={it.serieActivo || ''}
                                  onChange={e => actualizarCampoItemEnEdicionPlantilla(it.id, 'serieActivo', e.target.value)}
                                  className="w-full bg-white border border-line-strong rounded p-1 text-ink-primary"
                                />
                              </div>
                            )}
                            <div>
                              <label className="text-[10px] text-ink-support block">Cant. Solicitada</label>
                              <input
                                type="number"
                                min="1"
                                value={it.cantidadSolicitada}
                                onChange={e => actualizarCampoItemEnEdicionPlantilla(it.id, 'cantidadSolicitada', Number(e.target.value))}
                                className="w-full bg-white border border-line-strong rounded p-1 text-ink-primary"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-ink-support block">Destino</label>
                              <select
                                value={it.destino}
                                onChange={e => actualizarCampoItemEnEdicionPlantilla(it.id, 'destino', e.target.value)}
                                className="w-full bg-white border border-line-strong rounded p-1 text-ink-primary"
                              >
                                <option value="CLIENTE">CLIENTE</option>
                                <option value="NODO">NODO</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      ))}
                      {(!plantillaEnEdicion.items || plantillaEnEdicion.items.length === 0) && (
                        <p className="text-center text-ink-support text-xs py-4">Esta plantilla no tiene ítems. Añada al menos uno arriba.</p>
                      )}
                    </div>
                  </div>

                  <div className="flex gap-3 pt-3 border-t border-line-soft">
                    <button
                      onClick={() => setPlantillaEnEdicion(null)}
                      className="flex-1 bg-surface-alt hover:bg-surface-secondary text-ink-secondary py-2 rounded text-xs font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      onClick={guardarEdicionPlantilla}
                      className="flex-1 bg-brand-blue hover:bg-brand-cyan-bright text-slate-950 font-bold py-2 rounded text-xs"
                    >
                      Guardar Cambios de la Plantilla
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: ALTA DE TÉCNICO POR SUPERVISOR */}
            {mostrarModalCrearTecnicoSupervisor && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setMostrarModalCrearTecnicoSupervisor(false)}>
                <div className="bg-white border border-line-strong rounded-xl max-w-lg w-full p-6 space-y-4" onClick={e => e.stopPropagation()}>
                  <div className="border-b border-line-soft pb-3 flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-bold text-ink-primary">+ Registrar Técnico Ejecutante</h3>
                      <p className="text-xs text-ink-support">Habilitará al técnico en la plataforma y en las copias de correo</p>
                    </div>
                    <button onClick={() => setMostrarModalCrearTecnicoSupervisor(false)} className="text-ink-support hover:text-ink-primary text-lg">✕</button>
                  </div>

                  <form onSubmit={registrarTecnicoPorSupervisor} className="space-y-3 text-xs">
                    <div>
                      <label className="block text-ink-secondary mb-1">Nombre Completo del Técnico *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej. SOTO HUAMAN LUIS ALBERTO"
                        value={tecNombre}
                        onChange={e => setTecNombre(e.target.value)}
                        className="w-full bg-white border border-line-strong rounded p-2 text-ink-primary"
                      />
                    </div>

                    <div>
                      <label className="block text-ink-secondary mb-1">Correo Institucional *</label>
                      <input
                        type="email"
                        required
                        placeholder="luis.soto@felosotec.com"
                        value={tecEmail}
                        onChange={e => setTecEmail(e.target.value)}
                        className="w-full bg-white border border-line-strong rounded p-2 text-ink-primary"
                      />
                    </div>

                    <div>
                      <label className="block text-ink-secondary mb-1">Celular WhatsApp *</label>
                      <input
                        type="text"
                        required
                        placeholder="+51988776655"
                        value={tecCelular}
                        onChange={e => setTecCelular(e.target.value)}
                        className="w-full bg-white border border-line-strong rounded p-2 text-ink-primary font-mono"
                      />
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setMostrarModalCrearTecnicoSupervisor(false)}
                        className="flex-1 bg-surface-alt hover:bg-surface-secondary text-ink-secondary py-2 rounded font-semibold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="flex-1 bg-brand-blue hover:bg-brand-cyan-bright text-slate-950 font-bold py-2 rounded transition"
                      >
                        Guardar Técnico
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: GESTIÓN DE USUARIOS (ADMIN GENERAL) */}
            {mostrarModalUserAdmin && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setMostrarModalUserAdmin(false)}>
                <div className="bg-white border border-line-strong rounded-xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                  <div className="border-b border-line-soft pb-3 flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-bold text-ink-primary">👑 Configuración de Cuentas y Accesos</h3>
                      <p className="text-xs text-ink-support">Gestor centralizado de contraseñas y colaboradores en Firestore</p>
                    </div>
                    <button onClick={() => setMostrarModalUserAdmin(false)} className="text-ink-support hover:text-ink-primary text-lg">✕</button>
                  </div>

                  {/* CARGA MASIVA DE USUARIOS */}
                  <div className="bg-sky-500/5 border border-sky-500/30 rounded-lg p-3 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <p className="text-xs font-bold text-sky-600">📤 Carga Masiva de Usuarios</p>
                      <p className="text-[11px] text-ink-support">Descargue la plantilla, complétela y súbala para crear varias cuentas de una sola vez.</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        type="button"
                        onClick={descargarPlantillaUsuarios}
                        className="bg-surface-alt hover:bg-surface-secondary text-emerald-600 border border-emerald-500/30 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5"
                      >
                        📥 Descargar Plantilla Excel
                      </button>
                      <input
                        type="file"
                        ref={cargaMasivaInputRef}
                        accept=".xlsx,.xls"
                        onChange={manejarCargaMasivaUsuarios}
                        className="hidden"
                      />
                      <button
                        type="button"
                        onClick={dispararSelectorArchivoCargaMasiva}
                        disabled={cargandoMasivoUsuarios}
                        className="bg-sky-600 hover:bg-sky-500 disabled:opacity-60 disabled:cursor-not-allowed text-white px-3 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5"
                      >
                        {cargandoMasivoUsuarios ? '⏳ Procesando...' : '📤 Cargar Excel de Usuarios'}
                      </button>
                    </div>
                  </div>

                  <form onSubmit={guardarUsuarioAdmin} className="bg-white p-4 rounded-lg border border-line-soft space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                      <div>
                        <label className="block text-ink-support mb-1">Nombre de Usuario *</label>
                        <input
                          type="text"
                          required
                          value={userUsername}
                          onChange={e => setUserUsername(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-ink-support mb-1">
                          {usuarioEnEdicion ? 'Nueva Contraseña' : 'Contraseña *'}
                        </label>
                        <input
                          type="password"
                          required={!usuarioEnEdicion}
                          placeholder={usuarioEnEdicion ? 'Dejar en blanco para no cambiarla' : ''}
                          value={userPassword}
                          onChange={e => setUserPassword(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-ink-support mb-1">Rol *</label>
                        <select
                          value={userRol}
                          onChange={e => setUserRol(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        >
                          <option value="TECNICO_EJECUTANTE">Técnico Ejecutante</option>
                          <option value="SUPERVISOR_SOLICITANTE">Supervisor Solicitante</option>
                          <option value="ADMIN_LOGISTICA">Admin Logística</option>
                          <option value="ADMINISTRADOR">Administrador General</option>
                        </select>
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-ink-support mb-1">Nombre Completo *</label>
                        <input
                          type="text"
                          required
                          value={userNombre}
                          onChange={e => setUserNombre(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        />
                      </div>
                      <div>
                        <label className="block text-ink-support mb-1">Celular *</label>
                        <input
                          type="text"
                          required
                          value={userCelular}
                          onChange={e => setUserCelular(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary font-mono"
                        />
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-ink-support mb-1">Correo Electrónico *</label>
                        <input
                          type="email"
                          required
                          value={userEmail}
                          onChange={e => setUserEmail(e.target.value)}
                          className="w-full bg-white border border-line-strong rounded p-1.5 text-ink-primary"
                        />
                      </div>

                      {userRol === 'SUPERVISOR_SOLICITANTE' && (
                        <div>
                          <label className="block text-brand-petrol mb-1 font-bold">Tipo de Trabajo *</label>
                          <select
                            value={userTipoTrabajo}
                            onChange={e => setUserTipoTrabajo(e.target.value)}
                            className="w-full bg-white border border-brand-blue/50 rounded p-1.5 text-ink-primary font-semibold"
                          >
                            {TIPOS_TRABAJO.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        </div>
                      )}
                    </div>

                    <button type="submit" className="w-full bg-brand-blue hover:bg-brand-cyan-bright text-slate-950 font-bold py-2 rounded text-xs transition">
                      {usuarioEnEdicion ? 'Actualizar Cuenta' : 'Crear y Habilitar Acceso'}
                    </button>
                  </form>

                  <div className="max-h-60 overflow-y-auto pr-1">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-white text-ink-support text-[10px]">
                        <tr>
                          <th className="p-2">Usuario / Clave</th>
                          <th className="p-2">Colaborador</th>
                          <th className="p-2">Rol / Trabajo</th>
                          <th className="p-2 text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-line-soft text-ink-secondary">
                        {usuarios.map(u => (
                          <tr key={u.id} className="hover:bg-surface-secondary">
                            <td className="p-2 font-mono">
                              <span className="text-brand-petrol font-bold">{u.username}</span>
                              <p className="text-[10px] text-ink-support">Clave: •••••••• (protegida)</p>
                            </td>
                            <td className="p-2">
                              <p className="font-semibold">{u.nombre}</p>
                              <p className="text-[10px] text-ink-support">{u.email}</p>
                            </td>
                            <td className="p-2">
                              <span className="bg-surface-alt text-brand-petrol px-1.5 py-0.5 rounded text-[10px] font-mono block w-max">
                                {u.rol}
                              </span>
                            </td>
                            <td className="p-2 text-right space-x-2">
                              <button
                                onClick={() => notificarBienvenidaUsuario(u, null)}
                                title="Reenviar los datos de acceso por WhatsApp Web y correo"
                                className="text-emerald-600 hover:underline"
                              >
                                📲 Bienvenida
                              </button>
                              <button onClick={() => abrirEdicionUsuarioAdmin(u)} className="text-brand-petrol hover:underline">Editar</button>
                              <button onClick={() => eliminarUsuarioAdmin(u.id, u.nombre)} className="text-rose-600 hover:underline">Eliminar</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
