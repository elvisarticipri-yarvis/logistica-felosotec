            });

            localStorage.setItem('FELOSOTEC_USUARIOS_AUTH_V3', JSON.stringify(listU));

          await persistirUsuarioFirestore(uActualizado);

          alert(`[${ahora}] Usuario ${userUsername} actualizado.`);

                  <div className="border-b border-slate-800 pb-3 flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-bold text-white">👑 Configuración de Cuentas y Accesos</h3>
                      <p className="text-xs text-slate-400">Gestor centralizado de contraseñas y colaboradores en Firestore</p>
                    </div>
                    <button onClick={() => setMostrarModalUserAdmin(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                  </div>

                  <form onSubmit={guardarUsuarioAdmin} className="bg-slate-900 p-4 rounded-lg border border-slate-800 space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                      <div>
                        <label className="block text-slate-400 mb-1">Nombre de Usuario *</label>
                        <input 
                          type="text" 
                          required 
                          value={userUsername} 
                          onChange={e => setUserUsername(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Contraseña *</label>
                        <input 
                          type="text" 
                          required 
                          value={userPassword} 
                          onChange={e => setUserPassword(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Rol *</label>
                        <select 
                          value={userRol} 
                          onChange={e => setUserRol(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white"
                        >
                          <option value="TECNICO_EJECUTANTE">Técnico Ejecutante</option>
                          <option value="SUPERVISOR_SOLICITANTE">Supervisor Solicitante</option>
                          <option value="ADMIN_LOGISTICA">Admin Logística</option>
                          <option value="ADMINISTRADOR">Administrador General</option>
                        </select>
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-slate-400 mb-1">Nombre Completo *</label>
                        <input 
                          type="text" 
                          required 
                          value={userNombre} 
                          onChange={e => setUserNombre(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Celular *</label>
                        <input 
                          type="text" 
                          required 
                          value={userCelular} 
                          onChange={e => setUserCelular(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-mono"
                        />
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-slate-400 mb-1">Correo Electrónico *</label>
                        <input 
                          type="email" 
                          required 
                          value={userEmail} 
                          onChange={e => setUserEmail(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white"
                        />
                      </div>

                      {userRol === 'SUPERVISOR_SOLICITANTE' && (
                        <div>
                          <label className="block text-amber-400 mb-1 font-bold">Tipo de Trabajo *</label>
                          <select 
                            value={userTipoTrabajo} 
                            onChange={e => setUserTipoTrabajo(e.target.value)}
                            className="w-full bg-slate-950 border border-amber-500/50 rounded p-1.5 text-white font-semibold"
                          >
                            {TIPOS_TRABAJO.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        </div>
                      )}
                    </div>

                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded text-xs transition">
                      {usuarioEnEdicion ? 'Actualizar Cuenta' : 'Crear y Habilitar Acceso'}
                    </button>
                  </form>

                  <div className="max-h-60 overflow-y-auto pr-1">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 text-slate-400 text-[10px]">
                        <tr>
                          <th className="p-2">Usuario / Clave</th>
                          <th className="p-2">Colaborador</th>
                          <th className="p-2">Rol / Trabajo</th>
                          <th className="p-2 text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {usuarios.map(u => (
                          <tr key={u.id} className="hover:bg-slate-900/50">
                            <td className="p-2 font-mono">
                              <span className="text-amber-400 font-bold">{u.username}</span>
                              <p className="text-[10px] text-slate-500">Clave: {u.password}</p>
                            </td>
                            <td className="p-2">
                              <p className="font-semibold">{u.nombre}</p>
                              <p className="text-[10px] text-slate-400">{u.email}</p>
                            </td>
                            <td className="p-2">
                              <span className="bg-slate-800 text-amber-400 px-1.5 py-0.5 rounded text-[10px] font-mono block w-max">
                                {u.rol}
                              </span>
                            </td>
                            <td className="p-2 text-right space-x-2">
                              <button onClick={() => abrirEdicionUsuarioAdmin(u)} className="text-amber-400 hover:underline">Editar</button>
                              <button onClick={() => eliminarUsuarioAdmin(u.id, u.nombre)} className="text-rose-400 hover:underline">Eliminar</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
